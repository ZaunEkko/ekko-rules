proxy-providers:
  subscription:
    type: http
    url: PUT_YOUR_SUBSCRIPTION_URL_HERE
    path: ./proxy_provider/subscription.yaml
    interval: 3600
proxy-groups:
- name: ♻️ 手动切换
  type: select
  proxies:
  - DIRECT
  use:
  - subscription
- name: 🛑 广告拦截
  type: select
  proxies:
  - REJECT
  - ♻️ 手动切换
  - DIRECT
  use:
  - subscription
- name: 🧲 海外 AI
  type: select
  proxies:
  - ♻️ 手动切换
  - DIRECT
  use:
  - subscription
- name: 🎮 游戏平台
  type: select
  proxies:
  - ♻️ 手动切换
  - DIRECT
  use:
  - subscription
- name: 🎮 游戏下载
  type: select
  proxies:
  - DIRECT
  - ♻️ 手动切换
  use:
  - subscription
- name: 🔞 NSFW
  type: select
  proxies:
  - REJECT
  - ♻️ 手动切换
  - DIRECT
  use:
  - subscription
- name: 🌏 国内网站
  type: select
  proxies:
  - DIRECT
  - ♻️ 手动切换
  use:
  - subscription
- name: 🎬 流媒体
  type: select
  proxies:
