  recommended_action: keep
  current_product: standard
  resolution: The category-ads import resolves pinned include and @ads filtering semantics, emits 849 DOMAIN/DOMAIN-SUFFIX rules, excludes the sole regexp, and stays after private routing but before specialized services. The independent advertising group defaults to REJECT and remains manually switchable. category-ads-all is deliberately not imported.
