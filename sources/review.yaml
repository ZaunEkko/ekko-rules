  first_observed: 2026-08-04
  last_verified: '2026-08-04'
  phase_2_candidate: none
  recommended_action: keep-region-aware
  current_product: standard
  resolution: Two new groups separate default-DIRECT mainland cloud operations from manually selected overseas cloud infrastructure. Advertising and concrete AI, development, gaming, media, cloud-storage, Apple, and late-recovery service rules remain earlier. Overseas Alibaba OSS, Tencent COS, Huawei Cloud, UCloud US3, Kingsoft KS3, and China Telecom OOS region endpoints precede their broad mainland vendor roots; AWS China, Azure China, and Cloudflare China use domestic cloud, while global AWS—including aws.amazon.com, canonical and regional console hosts, sign-in, api.aws, and Lambda Function URLs—Azure, Google Cloud, Cloudflare, DigitalOcean, Vultr, Linode/Akamai, Oracle Cloud, and BytePlus international cloud use overseas cloud. Azure's current public infrastructure-domain inventory—including API Management, Container Registry, IoT, containers, data and analytics, Kubernetes, machine learning, Storage, SQL, Service Bus, Redis, Search, SignalR, and Static Web Apps—uses documented suffixes; retired services and Microsoft business-product roots remain excluded; Vultr Object Storage uses vultrobjects.com. JD Cloud DNS, edge, load-balancing, and WAF, Qiniu test delivery, and reviewed Cloudflare China infrastructure roots use domestic cloud. Qiniu Kodo's documented Southeast Asia and North America S3 endpoint forms precede a domestic qiniucs.com fallback so mainland buckets become DIRECT without capturing overseas buckets. Ordinary overseas infrastructure endpoints that would use the same default proxy selector through FINAL are not added only for classification completeness; region-sensitive AI, streaming, and similar services remain explicit because selected proxy geography changes behavior. Huawei's international console is separated from its domestic root, Baidu AI Cloud's primary portal and console use domestic cloud, and virtual-hosted Google Cloud Storage buckets stay with explicit GCP infrastructure. The exact unified OCI Console host cloud.oracle.com is included while the broad oracle.com root remains excluded. Shared googleapis.com remains under the Google policy; audited exact endpoints from Google's current global Cloud API inventory plus Firebase Storage and Realtime Database management APIs, documented Firebase data endpoints, virtual-hosted Storage, and rep.googleapis.com regional endpoints use overseas cloud. The duplicate china-web recaptcha.net entry is removed so reCAPTCHA retains the Google policy. Reviewed non-mainland Alibaba region suffixes cover both SERVICE.REGION.aliyuncs.com and SERVICE-vpc.REGION.aliyuncs.com APIs before the domestic aliyuncs.com catch-all; the explicit OSS overseas acceleration suffix remains ahead as well. No cloud CIDR, ASN, GEOSITE, regexp, generic consumer-company root, or broad Akamai tenant suffix is published. The two cloud segments intentionally precede Microsoft, Google, and the classic mainland aggregate; their 71 reviewed later-rule captures are frozen in the cloud routing ledger.
