- id: late-recovery-domain-keywords
  status: candidate-remove
  scope: direct-recovery
  summary: Historical brand substring matchers can route unrelated lookalike domains to DIRECT-default policies.
  evidence:
  - https://en.help.roblox.com/hc/en-us/articles/115005744663-Troubleshooting-Education-Networks
  first_observed: 2026-08-01
  last_verified: '2026-08-03'
  phase_2_candidate: direct-default-recovery
  recommended_action: removed
  current_product: standard-anchored-only
  resolution: All seven recovery DOMAIN-KEYWORD candidates remain excluded. Roblox uses anchored roblox.com and rbxcdn.com suffixes; all DIRECT-default policies now reject DOMAIN-KEYWORD at load time.
- id: direct-default-broad-keywords
  status: candidate-remove
  scope: routing-security
  summary: Broad Microsoft, Apple, TestFlight, and aria2 substring rules could route attacker-controlled lookalike domains to DIRECT-default policies.
  evidence:
  - sources/rules/microsoft.list
  - sources/rules/apple.list
  - sources/rules/china-web.list
  first_observed: 2026-08-02
  last_verified: '2026-08-03'
  phase_2_candidate: none
  recommended_action: removed-or-anchored
  current_product: standard-anchored-only
  resolution: Microsoft and aria2 keywords were removed; Apple CDN entries use anchored suffixes; TestFlight remains covered by apple.com. The canonical loader rejects future DIRECT-default DOMAIN-KEYWORD entries.
- id: transient-resolution-failures
  status: observe
  scope: all
  summary: NXDOMAIN with a live parent zone, NODATA, SERVFAIL, 403, timeout, or TLS errors are insufficient removal evidence alone.
  evidence: []
  first_observed: 2026-07-30
  last_verified: '2026-07-31'
  phase_2_candidate: evidence-refresh
  recommended_action: policy-split
  current_product: non-generating
  resolution: Technical failures and negative DNS/HTTP observations remain evidence policy only and map to no automatic deletion.
