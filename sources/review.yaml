  summary: Broad Microsoft, Apple, TestFlight, and aria2 substring rules could route attacker-controlled lookalike domains to DIRECT-default policies.
  evidence:
  - sources/rules/microsoft.list
  - sources/rules/apple.list
  - sources/rules/china-web.list
  first_observed: 2026-08-02
  last_verified: '2026-08-03'
  phase_2_candidate: none
  recommended_action: removed-or-anchored
  current_product: standard-anchored-only
  resolution: Microsoft and aria2 keywords were removed; Apple CDN entries use anchored suffixes; TestFlight remains covered by apple.com. The canonical loader rejects future DIRECT-default DOMAIN-KEYWORD entries.
- id: china-domain-direct-import
  status: accepted
  scope: routing-compatibility
  summary: Anchored mainland service domains restore DIRECT classification without relying on implicit DNS resolution before GEOIP.
  evidence:
  - https://github.com/v2fly/domain-list-community/tree/660198a50bac2ab10c567d95a472a7b33915d1b0
  - tests/fixtures/china-domain-import-ledger.json
  first_observed: 2026-08-03
  last_verified: '2026-08-03'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: A pinned MIT-licensed import emits only DOMAIN and DOMAIN-SUFFIX rules from 31 named mainland service categories. It excludes includes, !cn entries, keywords, regexes, single-label suffixes, local broad coverage, and matchers already covered by earlier specialized rules. The segment stays after late recovery and before terminal China GEOIP and FINAL.
- id: advertising-import
  status: accepted
  scope: routing-policy
  summary: A pinned anchored advertising list restores opt-out blocking without importing broad provider or analytics categories.
  evidence:
  - https://github.com/v2fly/domain-list-community/tree/660198a50bac2ab10c567d95a472a7b33915d1b0
  - tests/fixtures/advertising-import-ledger.json
  - tests/fixtures/advertising-routing-ledger.json
  - sources/rules/advertising.list
  first_observed: 2026-08-03
  last_verified: '2026-08-03'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: The category-ads import resolves pinned include and @ads filtering semantics, emits 849 DOMAIN/DOMAIN-SUFFIX rules, excludes the sole regexp, and stays after private routing but before specialized services. The independent advertising group defaults to REJECT and remains manually switchable. category-ads-all is deliberately not imported.
