  - docs/evidence/ad-vendors-2026-09-19.txt
  - sources/rules/advertising-curated.list
  - sources/rules/china-web.list
  first_observed: 2026-09-19
  last_verified: '2026-09-19'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: The curated advertising set was built additively while the import still shipped, so it skipped hosts the import already covered and those hosts had nothing behind them once it left - a sequencing error in ER-047, not a judgement change. googletagmanager.com and googletagservices.com are the worse case, because this repository's own ad-vendors evidence names them as advertising infrastructure while china-web carried them as mainland direct; both roots move to advertising-curated in full. The six mainland hosts are added as exact DOMAIN rules because their roots carry login, payment, platform APIs and general assets that must stay direct. All 109 admit hosts now reach advertising-curated and none of the 151 hold or reject hosts reach REJECT. The committed origin list, stale at 245 origins from the first round while later rounds used a larger uncommitted list, is regenerated deterministically from the china-web roots so the scan is reproducible.
- id: mainland-advertising-curation
  status: accepted
  scope: routing-policy
  summary: The curated advertising set was built from Western publisher declarations, so mainland advertising was its thinnest part; the mainland scan already held the candidates.
  evidence:
  - docs/evidence/cn-ad-review-2026-09-19.json
  - docs/evidence/cn-origins-2026-09-19.txt
  - sources/rules/advertising-curated.list
  first_observed: 2026-09-19
  last_verified: '2026-09-19'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: Three passes over the 30,974 hostnames this repository scanned from 2,017 mainland origins - advertising-delivery labels, tracking and analytics labels, and hostnames under roots the product still routes direct - yield 396 candidates of which 85 are admitted, taking advertising-curated from 494 to 587 rules with first-match coverage unchanged. The rejection counts are the finding - a leading ad, bid, ssp, gdt, union or ta label is wrong more often than right on mainland origins, where it matches China UnionPay, a Guangdong broadcaster, Tamil Wikipedia, government statistics bureaus, the reporting centre every mainland site links in its footer, and 53 public procurement portals. Third-party status removes 51 tracking candidates but keeps every government and Wikipedia case, so per-host review remains the only separator. retcode.taobao.com is held as browser monitoring for the same reason as newrelic.com, and first-party endpoints on financial hosts are not admitted because a REJECT could stall a checkout. 305 import advertising domains still reach a mainland direct policy and 270 of them appear in no observed hostname, being mobile application and SDK endpoints a web scan cannot see. beacon.qq.com was withdrawn for provenance after the scan proved it never observed that hostname, and the two endpoints it did observe ship instead.
- id: admission-criterion-scope
  status: accepted
  scope: routing-policy
  summary: Criterion 2 as written could not admit a publisher's own advertising subdomain, and the round's evidence file was generated from a hand-kept list rather than from the rules.
  evidence:
  - docs/SELF-OWNED-REBUILD.md
  - docs/evidence/cn-ad-review-2026-09-19.json
  - tests/test_profile.py
  first_observed: 2026-09-19
  last_verified: '2026-09-19'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: Two inconsistencies were raised in review and both were real. The evidence file recorded reject for hosts the product blocks, because it was generated from a hand-kept list of that round's admissions and anything admitted earlier fell through to the catch-all; every verdict is now derived from the shipped corpus, so the file cannot disagree with the product. The second point was that three hosts were admitted with a cross-site rationale while the scan only saw them on their operator's own site - true, and withdrawing them exposed that 29 already-shipped rules had the same shape, among them ad.sohu.com, ad.cnki.net and cpro.zol.com.cn. Criterion 2 read third-party to at least one observing origin, wording that came from Western third-party ad tech where every candidate was third-party by construction, and read literally it forbids blocking a publisher's own ad subdomain, which is most of what ad blocking is. It now admits either route and each record states which applies, 76 third-party and 32 own-endpoint. Nothing protective was lost because criterion 2 never stopped the dangerous cases - the government statistics bureaus, the mandatory footer reporting link and Tamil Wikipedia are all third-party and are rejected by criterion 3, and the financial endpoints by criterion 4. Four invariants are now asserted in AdvertisingAdmissionContractTests.
- id: published-rule-evidence-mapping
  status: accepted
  scope: routing-policy
  summary: The bidirectional test walked only the review records, so a deleted record left its rule shipping unexamined, and 28 rules had no committed per-host record at all.
  evidence:
  - docs/evidence/legacy-ad-review-2026-09-19.json
  - docs/SELF-OWNED-REBUILD.md
  - tests/test_profile.py
  first_observed: 2026-09-19
  last_verified: '2026-09-19'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: Walking the review records only proves the records that still exist are honoured; walking the published rules is what proves no rule ships without a committed reason. Enumerating them found 28 advertising rules with no record in any review file, among them clarity.ms, sensorsdata.cn, zhugeio.com, 51.la, wwads.cn and the Alibaba adashx tracking endpoints, all introduced by commit 78c939c and audited at the time but never recorded per host. A legacy review file now carries all 28 with what each endpoint is and why a REJECT is safe, and a new test maps every published rule to an admitted record or a publisher declaration. adash.man.aliyuncs.com was briefly removed as dead because it has no A record, which broke the cloud ordering test - the rule holds an ordering contract against the aliyuncs.com cloud policy, so resolvability is evidence about a host and not about what a rule is for. Criterion 1 named only the traffic-observation route although 421 shipped rules arrive through ads.txt and the delivery probe and most of china-web through Certificate Transparency and APNIC, so it now names every route the Method section describes. The three records restored in ER-050 had carried a withdrawal-era reason contradicting their own verdict; reasons are regenerated from the admission route and the test asserts route, reason and rationale agree.
- id: evidence-grade-and-import-masking
  status: accepted
  scope: routing-policy
  summary: Two advertising roots reached mainland direct once the import stopped masking them, a reviewed host was accepted as justification for blocking its whole root, and query seeds were being counted as verdicts.
  evidence:
  - docs/evidence/ad-root-review-2026-09-19.json
  - docs/evidence/ad-serving-probe-2026-09-19.json
  - sources/rules/china-web.list
  - tests/test_profile.py
  first_observed: 2026-09-19
  last_verified: '2026-09-19'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: 2mdn.net and app-measurement.com have been in china-web since the repository's first commit and never mattered because the retired import's advertising segment ran at position 4 and captured them before china-web at 49; retiring the import left Google Ad Manager delivery and Firebase Analytics routed as ordinary mainland websites, so both move to advertising-curated. The search is bounded and was run over the whole product - exactly four rules were covered by the retired advertising list, and the other two are correct as they stand because the specific advertising hosts beneath them are blocked while the roots stay direct. The mapping test accepted a suffix rule when any reviewed host sat beneath it, which would have accepted DOMAIN-SUFFIX,qq.com on the strength of mi.gdt.qq.com; it now requires the rule's own value to be evidenced, 24 roots gain an explicit record saying no other service lives under them, and app-us1.com is narrowed to its two reviewed hosts because ActiveCampaign infrastructure could not be shown to be advertising-only. The test also counted the Certificate Transparency seed list and the ads.txt candidate list as evidence although the first names bytedance.com and the second is what the delivery probe adjudicates; both are removed and the probe's verdicts are committed for the first time, 1,995 roots with 791 serving. The 19 rules left unmapped are the case the probe exists for - publishers declare google.com and creatives arrive from doubleclick.net - and each now records its declared seller beside the delivery root.
- id: mainland-evidence-contract
  status: accepted
  scope: routing-policy
  summary: The mainland segments had no published-rule-to-evidence mapping and no committed artifacts to map to, and two groups of grandfathered rules were claiming evidence routes they could not support.
  evidence:
  - docs/evidence/cn-apnic-verdicts-2026-09-19.json
  - docs/evidence/cn-observation-2026-09-19.json
  - docs/evidence/cn-legacy-direct-2026-09-19.json
  - docs/PROVENANCE.md
  first_observed: 2026-09-19
  last_verified: '2026-09-19'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: Advertising got a rule-to-evidence mapping first because a wrong rule there blocks something; a wrong mainland rule sends traffic direct that should be proxied, the same defect with a quieter failure, and 4,224 rules had neither a mapping nor a committed artifact to map to - the scan output, Certificate Transparency results and APNIC verdicts existed only in a working directory, so the corpus was unauditable and re-running a probe later returns different data. Three files now carry it, 3,778 rules by APNIC verdict, 177 seen by the scan without an APNIC verdict, and 269 grandfathered, with MainlandEvidenceContractTests requiring every rule in both segments to map. The legacy advertising file had claimed admission_route third-party for hosts whose observing origin was never recorded, which was an assertion dressed as evidence; it now records criteria_satisfied 3 and 4 with criterion 1 and 2 evidence marked not preserved, and the 269 mainland rules are treated identically. Both grandfathered sets are closed, asserted to shrink but never grow, because grandfathering rules already shipping and re-reviewed for safety is defensible while leaving a door open for new ones is not. 16 admitted records still carried the catch-all rejection reason beside an admit verdict, including ad.doubleclick.net and six mediav.com hosts admitted through a root rule; reasons are regenerated from the matching rule and the test now rejects any rejection language rather than one phrase. docs/PROVENANCE.md still described the pinned import as shipping with its ledger and attribution intact, and cited a deleted ledger and the pre-retirement cloud capture count.
- id: cloudflare-china-own-domain
  status: accepted
  scope: routing-policy
  summary: The Cloudflare China infrastructure family was carried in china-cloud without cloudflare.cn, the domain the service is named after.
  evidence:
  - sources/rules/china-cloud.list
  first_observed: 2026-09-19
  last_verified: '2026-09-19'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: A mainland user reached cloudflare.cn through the proxy while cloudflare-cn.com, cloudflarechina.cn, cloudflarecn.net, cloudflareinsights-cn.com and cf-ns.com all went direct. It joins its family in china-cloud, which is both where it belongs and what the evidence permits - the APNIC probe cannot adjudicate it, because resolving cloudflare.cn from outside the mainland returns a Hong Kong address while the China network answers differently depending on where the question is asked. That is a limit of the probe rather than a finding about the domain, and it is why ER-023's reviewed Cloudflare China roots sit in china-cloud on review rather than on a probe verdict.
- id: overseas-shopping-policy
  status: accepted
  scope: routing-policy
  summary: A retailer that needs its own exit had nowhere to go but the fallback, so overseas shopping becomes its own segment and group.
  evidence:
  - sources/rules/overseas-shopping.list
  - sources/proxy-groups.yaml
  - sources/manifest.yaml
  first_observed: 2026-09-19
  last_verified: '2026-09-19'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: Takealot answers a proxy exit with a Cloudflare interstitial that other sites accept, which is IP reputation rather than a country block, and reaching it meant changing the fallback for everything. The new group holds 76 roots - regional Amazon storefronts, eBay, Etsy, Japanese shops including DLsite, Rakuten, ZOZO, Suruga-ya, Mandarake and AmiAmi, the forwarding services a cross-border order passes through, and regional retailers such as Gmarket, SSG and Takealot - admitted because what these sites display, sell and challenge depends on the exit, not because the category was untidy. The segment runs after every other service segment so amazon.com cannot take aws.amazon.com, console.aws.amazon.com or media-amazon.com, all verified. lazada.com, lazada.sg, shopee.com and shopee.sg were dropped - the Lazada family is already direct in china-web, the duplicate registered as a dead rule that the coverage gate caught, and splitting a brand whose mainland entry is deliberately direct across two policies is worse than leaving it whole. cloudflareperf.com joins china-cloud with the Cloudflare China family on an APNIC-confirmed mainland apex.
- id: mainland-probe-client-subnet
  status: accepted
  scope: routing-policy
  summary: The mainland hosting probe resolved without naming a client subnet, so geo-DNS services answered for the probe's own location and were recorded as foreign.
  evidence:
  - scripts/mainland_hosting_probe.py
  - docs/evidence/cn-apnic-verdicts-2026-09-19.json
  first_observed: 2026-09-19
  last_verified: '2026-09-19'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: xinhuanet.com returns 156.238.128.x to this repository and 117.177.70.x to a mainland client, so the probe read the first and called a China Mobile-hosted site foreign - the normal case for exactly the CDN-fronted services a mainland direct rule is about. The probe now names a mainland client subnet with EDNS Client Subnet, and four roots previously classified as foreign are mainland-hosted under the corrected question - xinhuanet.com, chinanews.com.cn, honor.cn and cloudflareperf.com. The fix is not total and the residue is informative - Cloudflare answers from anycast and ignores the named subnet, so cloudflare.cn still has no verdict, which is a finding about the method rather than the domain. The ByteDance probe endpoints split under the corrected probe - perfops.byte-test.com resolves into mainland space while perfops1 through perfops3 of byteperf.com stay foreign because they are deliberately spread across regions - so byte-test.com is admitted on the APNIC route and byteperf.com on a routing rationale, that a client measuring which CDN node to use must measure the path its media traffic takes. That rationale lives in a fourth evidence route which carries more proof than the others rather than less - every record states its reason, vendor attribution and the limitation that put it there, and the category is capped at eight. lenovo.com.cn was examined and not added because it answers from Akamai's global edge even for a mainland client.
- id: byteperf-overseas-correction
  status: accepted
  scope: routing-policy
  summary: A routing rationale was allowed to override this repository's own measurement, and the field reported the result as domestic traffic that should have been overseas.
  evidence:
  - docs/evidence/cn-apnic-verdicts-2026-09-19.json
  - sources/rules/china-web.list
  - tests/test_profile.py
  first_observed: 2026-09-19
  last_verified: '2026-09-19'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: ER-056 admitted byteperf.com after its own probe said the endpoints answer from outside the mainland, on the argument that a client measuring which CDN node to use must measure the path its media takes. The split-tunnel test that surfaced them labels those rows 海外 and 国际, and with the rule shipping they reported a Hangzhou address - the product was forcing overseas measurement endpoints down the domestic path. perfops1 through perfops3 resolve to 35.219.10.74, 95.40.53.40 and 47.84.187.31 for a mainland client because ByteDance spreads them across regions deliberately; that is the finding, and reasoning past it was the error. The rule is removed while byte-test.com stays on the APNIC route. cn-review-admitted-2026-09-19.json is deleted with it, because a blind-spot patch holding nothing is scaffolding rather than a route, and MainlandEvidenceContractTests returns to three evidence routes.
- id: remote-streaming-two-jobs
  status: accepted
  scope: routing-policy
  summary: One vendor suffix covered both the admin console and the streaming payload, so no single policy could be right for it.
  evidence:
  - sources/rules/remote-streaming-admin.list
  - sources/rules/remote-streaming.list
  - sources/proxy-groups.yaml
  - scripts/profile_model.py
  first_observed: 2026-09-19
  last_verified: '2026-09-19'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: The group was DIRECT-first and held DOMAIN-SUFFIX,tailscale.com, so a browser opening the admin console took the direct path and never arrived; moving the suffix to a proxy policy is equally wrong because the DERP relays under it carry the streaming payload and the field reported proxy traffic climbing when that was tried. The policy is now two - 远程串流后台 leading with the manual selector and holding 19 console and website hosts across Tailscale, ZeroTier, NetBird, Parsec, RustDesk, AnyDesk, TeamViewer and Moonlight, and 远程串流流量 leading with DIRECT and holding the 65 data-plane rules. The admin segment runs immediately before the data segment so an exact console host wins while the vendor suffix beneath it keeps carrying the payload direct, verified per host for derp1a, controlplane, ts.net, root.zerotier.com, kessel-ws.parsec.app, rs-ny.rustdesk.com, net.anydesk.com, master1.teamviewer.com, signal.netbird.io and remotedesktop.google.com. The product sits at the Subconverter 64-segment ceiling, so the new segment is funded the way ER-023 established - xai is concatenated into ai-platforms without reordering, routing cannot change because every segment in that family targets the same policy, and the retired Raw URL survives as a generated-only compatibility copy behind frozen hashes.
- id: session-split-across-policies
  status: accepted
  scope: routing-policy
  summary: A page or a game session reaching through two policies at once is the defect behind three separate reports.
  evidence:
  - sources/rules/game-download.list
  - sources/rules/game-platform.list
  - sources/rules/china-web.list
  - docs/evidence/cn-apnic-verdicts-2026-09-19.json
  first_observed: 2026-09-19
  last_verified: '2026-09-19'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: psnine.com rendered with every cover image broken because DOMAIN-SUFFIX,dl.playstation.net sat in the DIRECT-first download policy while psnobj and psn-rsc under it are the object CDN a web page loads cover art from, and direct access to them times out. The suffix is replaced by the endpoints that carry game content - ww.prod.dl.playstation.net for the gs2 family plus zeus and ares named exactly - so everything else falls through to the platform policy with the rest of PSN's web surface, and gs2.ww.prod answers from a China Telecom address so the mainland download path is preserved. psnine.com itself is APNIC-confirmed mainland and joins china-web. Honkai Star Rail reported proxy use because its dispatch and login domains reached the platform policy while the game server, which dispatch hands out as a bare address, fell to the fallback - two exits for one session. starrails.com was the larger half of that split, sitting wholly in the download policy, so autopatchos stays and the rest joins the platform; the IP-CIDR 8.209.192.0 slash 18 block with no-resolve covers the gateway pool that RDAP places in Alibaba Cloud Japan. A single-address rule would go stale the first time the pool moved and that failure is the detection firing again, while under fake-ip the breadth costs little because no-resolve means the rule only sees connections made to a bare address.
- id: lite-product-same-routing
  status: accepted
  scope: product-shape
  summary: A second build folds 42 policy groups into 10 without changing what any segment does.
  evidence:
  - sources/manifest.yaml
  - sources/proxy-groups.yaml
  - scripts/profile_model.py
  - tests/test_profile.py
  first_observed: 2026-09-19
  last_verified: '2026-09-19'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: Forty-two groups exist so each kind of traffic can be pointed at its own node, which for anyone who does not want that is a screen of dropdowns before the profile is usable. The lite build keeps the same 64 segments and the same rule files and only changes the target a segment names, expressed as Segment.lite_target with target_for(product) so the fold is a per-segment retarget rather than an edit. Forty-seven segments are retargeted - the ones that each had a group of their own and all defaulted to a proxy go to 国外服务 or 流媒体, the mainland groups that defaulted to direct go to 国内网站 - leaving ten groups chosen by whether someone plausibly wants to point them somewhere different, not by count. The safety claim covers every segment rather than the inspected ones, so LiteProductTests compares the effective action of all 64 across both products by following a target to its group's leading member, and both give 17 DIRECT, 45 PROXY and 2 REJECT. That test was checked against an injected fault - retargeting 游戏下载 to 国外服务, a fold that reads reasonable and is wrong because a metered download would start spending proxy bandwidth - and it fails. The cost is granularity alone - Netflix and YouTube share 流媒体 and move together - and it is stated in both READMEs beside the group count.
- id: hoyoverse-gateway-pool-is-alibaba-international
  status: accepted
  scope: routing-policy
  summary: A Japanese sub-block was mistaken for the whole gateway pool, so Singapore gateways fell to the fallback.
  evidence:
  - sources/rules/game-platform.list
  - sources/rules/remote-streaming-admin.list
  first_observed: 2026-09-19
  last_verified: '2026-09-19'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: ER-059 admitted the Japanese allocation after observing one gateway at 8.209.197.93, and Honkai Star Rail kept refusing login with 1001_1. A router log caught the connection at the moment of failure - UDP to 8.216.16.211 port 23301, the HoYoverse gateway port, matching only MATCH and using the fallback while the login session used another exit, which is what the risk check rejects. RDAP places 8.209.197.93 in ALICLOUD-JP 8.209.192.0 slash 18 and 8.216.16.211 in ASEPL-SG 8.208.0.0 slash 12, and the Japanese range is a sub-block carved out of the Singapore one - so the earlier rule took a sub-block for the whole pool. The rule is now the exact boundary of the ASEPL-SG allocation rather than a range invented to be wide enough, with edges verified at 8.208.0.1 and 8.223.255.254 matching while 8.207.255.255 and 8.224.0.1 fall through. Under fake-ip the breadth costs little because no-resolve means the rule only sees connections made to a bare address, and both the fallback and the game policy lead with the manual selector so the default action is unchanged. console.tailscale.com joins the remote-streaming admin segment on the same round - it answers from CloudFront while login and controlplane sit in Tailscale's own 192.200.0.0 space, relays are not served from a CDN, and direct access from the mainland times out; as an exact DOMAIN it cannot touch a relay, re-verified for derp1a, controlplane, ts.net and log.tailscale.io in both builds. ZeroTier's data plane was seen on the fallback in the same log and is deliberately left alone - its registered block belongs to Datacamp, a CDN, and direct reachability of a Zurich root from the mainland is not established while the proxy path works, so moving it needs a measurement first.
- id: version-check-must-not-assert-stale-currency
  status: accepted
  scope: selfhost-web
  summary: A thirty-minute cache made the page state that a deployment was current when a newer tag existed.
  evidence:
  - selfhost/app/src/lib/latest-version.ts
  - selfhost/app/src/lib/latest-version.test.ts
  - selfhost/app/src/app/api/health/route.ts
  first_observed: 2026-09-19
  last_verified: '2026-09-19'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: After selfhost-v0.2.1 was published the deployed page still read 最新 0.2.0 with update_available false, because the check cached for thirty minutes while the update timer pulls every five. A stale cache here does not withhold the answer, it states the opposite with the same confidence as a correct one, which is the failure the check was added to prevent; and once the image moved first the page would print a running version newer than the latest beside it. The cache existed only to protect the anonymous api.github.com budget of 60 requests an hour per address, which this server spends on every visitor's behalf, so a lookup per load would have broken for everyone at sixty visits in an hour. Tags now come from git's ref advertisement at info/refs service=git-upload-pack, roughly 6 KB and not metered that way, so the quota no longer dictates freshness and the check runs on every load. A failure is held for a minute so a failing lookup does not make each visitor wait out the timeout, concurrent callers still share one request, and the health endpoint reports the running version as latest whenever the check lags behind the image, because the running image was built from a published tag and a smaller number would be both wrong and alarming. The star count keeps its own thirty-minute clock on the REST API since it does not need to be fresh.
- id: finance-needs-its-own-exit
  status: accepted
  scope: routing-policy
  summary: Financial accounts are checked against where they are used, so they cannot share an exit with every unclassified request.
  evidence:
  - sources/rules/finance.list
  - sources/rules/china-web.list
  - sources/proxy-groups.yaml
  - docs/evidence/cn-apnic-verdicts-2026-09-19.json
  first_observed: 2026-09-19
  last_verified: '2026-09-19'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: wise.com reached the fallback and worked, which is why it went unnoticed - the fallback is a proxy so the page loaded, but it had no exit of its own, and a financial account is checked against where it is used. Sharing an exit with every unclassified request means that exit moves whenever anything else does, which is the same defect as the game session. The finance policy leads with the manual selector and holds 44 rules across payments and remittance, virtual cards, SMS receipt and virtual numbers, and overseas banks and brokers. Virtual cards and SMS receipt belong with the rest because they are the step where an account is created and the registering address is the one the account is thereafter expected to arrive from. Every domain was resolved before admission and the ones that did not answer were left out; futunn.com and moomoo.com were checked rather than assumed because a broker on Tencent Cloud reads like a mainland service, and both resolve into Hong Kong rather than mainland ranges. The segment is funded the way ER-023 established - kakao-talk concatenated into line, the two adjacent with nothing between them and both targeting the same chat policy, so nothing can reorder and nothing can change policy, verified per host afterwards, with the retired Raw URL kept as a generated-only compatibility slice behind frozen hashes. Checking that mainland banks stayed direct turned up twelve on the fallback, which is worse than a foreign bank there because the proxy exit is what their risk check objects to; the mainland probe admitted the eight that resolve wholly into APNIC CN ranges and left four out - cloudpay.com.cn and yunshanfu.cn resolve outside them, gdb.com.cn and hsbank.cc do not resolve - because a bank being obviously Chinese is a reason to look rather than a verdict.

- id: steam-cm-follows-download-exit
  status: accepted
  scope: game-download
  summary: Steam connection managers must leave through the download exit, because Steam picks content servers from the address it sees on the CM connection.
  evidence:
  - docs/evidence/steam-cm-runtime-observation-2026-09-25.json
  - sources/rules/game-download.list
  - sources/rules/game-platform-late-recovery.list
  - User's own Steam client content_log and connection_log on 2026-09-25; no subscription, node, account, or endpoint credentials retained
  first_observed: 2026-09-25
  last_verified: '2026-09-26'
  phase_2_candidate: none
  recommended_action: keep
  current_product: standard
  resolution: With game-download on DIRECT, Steam still waited a long time before downloading and then crawled, while switching game-download to a proxy ran at full speed. The logs show why. steamserver.net sat in game-platform-late-recovery, so the CM connection used the game-platform proxy, and Steam handed out 14 sources led by Tokyo SteamCache hosts plus overseas Akamai, Fastly and Google CDNs. The DIRECT download policy then went straight to those overseas hosts; every Tokyo cache failed after about five seconds, one update was cancelled on a manifest timeout, and the running rate stayed between 0.05 and 39 Mbps. When the user disabled the gateway, the CM connected directly (to the same tyo3 data centre) and within half a minute Steam switched to three or four mainland CDNs at 148-366 Mbps, with CellID 198 unchanged throughout. The deciding input is therefore the CM connection's public address, not the CM location or the configured region. The steamserver.net suffix moves from game-platform-late-recovery into game-download, which runs earlier and defaults to DIRECT, so the CM and the downloads share one exit. That exit is still the user's choice, so selecting a proxy for game-download keeps both consistent the other way too. The late-recovery set shrinks by one entry and gains none. api.steampowered.com stays with the platform because the logs do not show it deciding the content list, and the chunk redirect hosts gstore.val.smogfly.com and yif.gdtstream.com stay unaccepted because a single redirect each is not enough evidence.
