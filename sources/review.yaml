schema_version: 1
reviewed_on: 2026-08-01
purpose: Non-generating review queue for uncertain, legacy, brand-defense, personal/community, or relocation candidates. Entries here never change generated routing by themselves.
allowed_statuses:
- observe
- legacy
- brand-defense
- personal-community
- candidate-remove
- candidate-move
items:
- id: apple-brand-defense
  status: brand-defense
  scope: apple
  summary: Apple defensive registrations and non-core domains need category-level review.
  evidence:
  - https://github.com/blackmatrix7/ios_rule_script/tree/011471410d3fcc3301c168ee91eb92bc74ebded6/rule/Clash/Apple
  first_observed: 2026-07-30
  last_verified: '2026-07-31'
  phase_2_candidate: apple-brand-defense
  recommended_action: split-deferred
  preset: core-and-optional
  resolution: Phase 3 keeps only evidenced Apple core rules. Historical brand-defense entries that reappear in apple-late-recovery are retained solely to restore Phase 2 DIRECT-default routing; their current Apple ownership is not reverified, and exact classification remains deferred to a separately evidenced batch.
- id: apple-legacy-products
