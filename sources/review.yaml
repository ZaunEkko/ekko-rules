- id: mainland-game-voice-and-international-boundaries
  status: accepted
  scope: routing-security
  summary: Mainland game voice and content routing require precise first-match separation from international TikTok and shared cloud infrastructure.
  evidence:
  - https://intl.cloud.tencent.com/document/product/607/35232
  - https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/tencent-games
  - https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/category-game-platforms-download
  - https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/tiktok
  - tests/test_profile.py
  first_observed: 2026-08-04
  last_verified: '2026-08-09'
  phase_2_candidate: none
  recommended_action: keep-precise
  current_product: standard
  resolution: The official Douyin-only aweme.snssdk.com host enters mainland media, which is ordered before TikTok, while the shared snssdk.com suffix remains in TikTok so unclassified international traffic keeps the user's selector. Tencent Native GVoice/GME service roots and documented exact qcloud configuration, RTC, and speech hosts are routed through china-web so domestic game voice stays DIRECT; generic qcloud.com, myqcloud.com, cloud/CDN roots, dynamic service IPs, and a WeGame process-wide rule remain excluded. The observed down.val.qq.com download host and reviewed dedicated download endpoints enter game-download before the broader domestic val.qq.com rule. Advertising stays first and continues to capture Amap, MiHoYo, and Zuoyebang telemetry. Overseas game storefronts use game-platform, while TapTap international taptap.io remains outside mainland rules.
