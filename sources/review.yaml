  last_verified: '2026-07-31'
  phase_2_candidate: apple-legacy
  recommended_action: split-deferred
  preset: core-and-optional
  resolution: Phase 3 keeps evidenced current Apple roots. Historical product and compatibility entries that reappear in apple-late-recovery preserve Phase 2 DIRECT-default behavior only; they remain legacy review candidates rather than newly validated Apple ownership.
