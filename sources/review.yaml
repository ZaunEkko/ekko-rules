- id: late-recovery-domain-keywords
  status: candidate-remove
  scope: direct-recovery
  summary: Historical brand substring matchers can route unrelated lookalike domains to DIRECT-default policies.
  evidence:
  - https://en.help.roblox.com/hc/en-us/articles/115005744663-Troubleshooting-Education-Networks
  first_observed: 2026-08-01
  last_verified: '2026-08-01'
  phase_2_candidate: direct-default-recovery
  recommended_action: removed
  preset: core-and-extended
  resolution: All seven DOMAIN-KEYWORD candidates are excluded from late recovery. Roblox is replaced by anchored roblox.com and rbxcdn.com suffixes from the official education-network allowlist; the other six keywords were already represented by earlier precise rules. Lookalike domains continue to FINAL.
- id: transient-resolution-failures
  status: observe
  scope: all
  summary: NXDOMAIN with a live parent zone, NODATA, SERVFAIL, 403, timeout, or TLS errors are insufficient removal evidence alone.
  evidence: []
  first_observed: 2026-07-30
  last_verified: '2026-07-31'
  phase_2_candidate: evidence-refresh
  recommended_action: policy-split
  preset: non-generating
  resolution: Technical failures and negative DNS/HTTP observations remain evidence policy only and map to no automatic deletion.
