ed while the broad oracle.com root remains excluded. Shared googleapis.com remains under the Google policy; audited exact endpoints from Google's current global Cloud API inventory plus Firebase Storage and Realtime Database management APIs, documented Firebase data endpoints, virtual-hosted Storage, and rep.googleapis.com regional endpoints use overseas cloud. The duplicate china-web recaptcha.net entry is removed so reCAPTCHA retains the Google policy. Reviewed non-mainland Alibaba region suffixes cover both SERVICE.REGION.aliyuncs.com and SERVICE-vpc.REGION.aliyuncs.com APIs before the domestic aliyuncs.com catch-all; the explicit OSS overseas acceleration suffix remains ahead as well. No cloud CIDR, ASN, GEOSITE, regexp, generic consumer-company root, or broad Akamai tenant suffix is published. The two cloud segments intentionally precede Microsoft, Google, and the classic mainland aggregate; their 71 reviewed later-rule captures are frozen in the cloud routing ledger.
