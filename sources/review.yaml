purpose: Non-generating review queue for historical, uncertain, legacy, brand-defense, personal/community, or relocation evidence. Entries never change generated routing by themselves; phase_2_candidate records are historical labels, not current products.
allowed_statuses:
- observe
- legacy
- brand-defense
- personal-community
- candidate-remove
- candidate-move
