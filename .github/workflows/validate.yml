name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Compile Python modules
        run: >-
          python -m py_compile
          scripts/profile_model.py
          scripts/generate_profile.py
          scripts/validate_generated.py
          scripts/reverse_profile.py
          tests/test_profile.py

      - name: Run unit and behavior tests
        run: python -m unittest discover -s tests -v

      - name: Validate generated products
        run: python scripts/validate_generated.py

      - name: Confirm deterministic generation
        run: python scripts/generate_profile.py --check

      - name: Confirm clean generated tree
        shell: bash
        run: git diff --exit-code -- generated/reversed-profile
