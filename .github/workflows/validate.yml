name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Compile Python modules
        run: >-
          python -m py_compile
          scripts/profile_model.py
          scripts/generate_profile.py
          scripts/validate_generated.py
          tests/test_profile.py

      - name: Run unit and behavior tests
        run: python -m unittest discover -s tests -v

      - name: Validate generated products
        run: python scripts/validate_generated.py

      - name: Confirm deterministic generation
        run: python scripts/generate_profile.py --check

      - name: Confirm clean generated tree
        shell: bash
        run: git diff --exit-code -- generated/reversed-profile

  selfhost:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: selfhost/app/package-lock.json

      - name: Install selfhost dependencies
        working-directory: selfhost/app
        run: npm ci

      - name: Regenerate selfhost rule snapshot
        run: node selfhost/scripts/sync-rulesets.mjs

      - name: Confirm clean selfhost rule snapshot
        shell: bash
        run: >-
          git diff --exit-code --
          selfhost/subconverter/config
          selfhost/subconverter/rulesets

      - name: Run selfhost unit tests
        working-directory: selfhost/app
        run: npm test

      - name: Type-check selfhost app
        working-directory: selfhost/app
        run: npm run typecheck

      - name: Build selfhost app
        working-directory: selfhost/app
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Validate selfhost Compose configuration
        run: docker compose -f selfhost/compose.yaml config --quiet

      - name: Validate the published-image overlay
        working-directory: selfhost
        env:
          SELFHOST_MODE: public
          PUBLIC_BASE_URL: https://sub.example.com
        run: docker compose -f compose.yaml -f compose.ghcr.yaml config --quiet

      - name: Validate the reverse proxy example
        run: |
          docker run --rm -v "$PWD/selfhost/nginx:/site:ro" nginx:alpine sh -c 'cp /site/sub.example.com.conf /tmp/site.conf && sed -i "s#include /etc/nginx/snippets/cloudflare-only.conf;##; s#ssl_certificate .*#ssl_certificate /tmp/c.pem;#; s#ssl_certificate_key .*#ssl_certificate_key /tmp/k.pem;#; s#include /etc/letsencrypt/options-ssl-nginx.conf;##; s#ssl_dhparam .*##" /tmp/site.conf && apk add --no-cache openssl >/dev/null && openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/k.pem -out /tmp/c.pem -days 1 -subj "/CN=t" >/dev/null 2>&1 && rm -f /etc/nginx/conf.d/default.conf && cp /tmp/site.conf /etc/nginx/conf.d/ && nginx -t'

      - name: Validate Unix shell helpers
        run: |
          sh -n selfhost/start.sh
          sh -n selfhost/scripts/vps-update.sh
