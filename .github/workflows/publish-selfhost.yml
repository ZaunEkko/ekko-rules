name: Publish selfhost images

# Builds the self-hosted converter images and publishes them to GHCR so a
# server deploys a known digest instead of building from source.
#
# No server credential lives in this repository: the VPS pulls, nothing here
# pushes to it. See selfhost/docs/vps.md for the update timer that consumes
# these images.

on:
  push:
    tags:
      - "selfhost-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish, besides latest and the commit sha"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-selfhost
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve image names and tags
        id: tags
        shell: bash
        env:
          EXTRA_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # A container repository name may not contain uppercase letters, and
          # the owner login does.
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr "[:upper:]" "[:lower:]")"
          echo "WEB_IMAGE=${REGISTRY}/${owner}/ekko-rules-selfhost-web" >> "$GITHUB_ENV"
          echo "ENGINE_IMAGE=${REGISTRY}/${owner}/ekko-rules-selfhost-subconverter" >> "$GITHUB_ENV"
          short_sha="$(git rev-parse --short HEAD)"
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version="sha-${short_sha}"; fi
          # selfhost-v0.1.0 must publish as 0.1.0, which is what the deploy
          # docs tell operators to pin in EKKO_IMAGE_TAG.
          version="${version#selfhost-}"
          version="${version#v}"
          # A server that follows `latest` must only ever receive releases.
          # A manual dispatch still publishes sha-<commit> (and any extra tag
          # asked for), but it does not move the pointer those servers track.
          # The event name matters as much as the ref type: workflow_dispatch
          # accepts a tag as its ref, which would otherwise read as a release.
          is_release=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            is_release=true
          fi
          # `latest` is not a name anything else may claim. The optional input
          # is one way in; a ref named `latest`, `vlatest` or `selfhost-vlatest`
          # is the other, since the stripping above turns all three into the
          # same string and every build tags $IMAGE:$VERSION unconditionally.
          for candidate in "${version}" "${EXTRA_TAG:-}"; do
            if [ "$(echo "$candidate" | tr "[:upper:]" "[:lower:]")" = "latest" ]; then
              echo "Refusing to publish '$candidate': the latest pointer is moved by releases only." >&2
              exit 1
            fi
          done
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "is_release=${is_release}" >> "$GITHUB_OUTPUT"

      - name: Confirm the rule snapshot matches the repository
        shell: bash
        run: |
          set -euo pipefail
          node selfhost/scripts/sync-rulesets.mjs
          git diff --exit-code -- selfhost/subconverter/config selfhost/subconverter/rulesets

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf "%s" "$GHCR_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      # Both images are built before anything is pushed, and `latest` moves
      # only after both are in the registry under immutable tags. Promoting it
      # from inside a per-image step would let a failed web build leave a new
      # engine `latest` paired with the previous web one, and a server whose
      # timer follows `latest` would deploy that mismatched pair.
      - name: Build both images
        shell: bash
        env:
          VERSION: ${{ steps.tags.outputs.version }}
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
          EXTRA_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          engine=(--tag "$ENGINE_IMAGE:$VERSION" --tag "$ENGINE_IMAGE:sha-$SHORT_SHA")
          web=(
            --build-arg "EKKO_RULES_VERSION=$VERSION"
            --tag "$WEB_IMAGE:$VERSION"
            --tag "$WEB_IMAGE:sha-$SHORT_SHA"
          )
          if [ -n "$EXTRA_TAG" ]; then
            engine+=(--tag "$ENGINE_IMAGE:$EXTRA_TAG")
            web+=(--tag "$WEB_IMAGE:$EXTRA_TAG")
          fi
          docker build "${engine[@]}" selfhost/subconverter
          docker build "${web[@]}" selfhost/app

      # Named tags rather than --all-tags: the latter pushes whatever happens
      # to be tagged locally, which is how `latest` escapes by accident.
      - name: Push the immutable tags
        shell: bash
        env:
          VERSION: ${{ steps.tags.outputs.version }}
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
          EXTRA_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for image in "$ENGINE_IMAGE" "$WEB_IMAGE"; do
            docker push "$image:$VERSION"
            docker push "$image:sha-$SHORT_SHA"
            if [ -n "$EXTRA_TAG" ]; then docker push "$image:$EXTRA_TAG"; fi
          done

      - name: Promote latest
        if: steps.tags.outputs.is_release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          set -euo pipefail
          for image in "$ENGINE_IMAGE" "$WEB_IMAGE"; do
            docker tag "$image:$VERSION" "$image:latest"
          done
          for image in "$ENGINE_IMAGE" "$WEB_IMAGE"; do
            docker push "$image:latest"
          done

      - name: Record the published digests
        shell: bash
        env:
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          set -euo pipefail
          echo "### Published images" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for image in "$ENGINE_IMAGE" "$WEB_IMAGE"; do
            digest="$(docker image inspect --format "{{index .RepoDigests 0}}" "$image:$VERSION" || echo unknown)"
            echo "- $image:$VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "  - $digest" >> "$GITHUB_STEP_SUMMARY"
          done
