# Deploy published images instead of building on the server.
#
#   docker compose -f compose.yaml -f compose.ghcr.yaml pull
#   docker compose -f compose.yaml -f compose.ghcr.yaml up -d
#
# The base file keeps its `build:` sections, which stay unused unless you pass
# --build. Pin EKKO_IMAGE_TAG to a released tag (selfhost-v1.2.3 publishes
# 1.2.3) so a deploy is reproducible and a rollback is one variable away.
services:
  subconverter:
    image: ghcr.io/${EKKO_IMAGE_OWNER:-zaunekko}/ekko-rules-selfhost-subconverter:${EKKO_IMAGE_TAG:-latest}

  web:
    image: ghcr.io/${EKKO_IMAGE_OWNER:-zaunekko}/ekko-rules-selfhost-web:${EKKO_IMAGE_TAG:-latest}
