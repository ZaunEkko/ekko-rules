# sub.<your-domain> —— 开放订阅转换站的对外 HTTPS 入口。
#
# 转换服务只监听 127.0.0.1:8787（.env 里 WEB_BIND_HOST=127.0.0.1），由这个
# vhost 反代。本项目不自带反向代理：TLS、证书与访问控制都交给这台机器上
# 已有的 nginx。
#
# 与同机其它子域的唯一结构性差异是日志：这个站的查询串里带着访客的真实机场
# 订阅地址，所以必须用下面的 sub_noquery 格式，只记录 $uri。用默认的
# combined 会把每个访客的订阅凭据落进磁盘日志。

# 只记录路径，丢弃查询串。放在 http 块级别（conf.d/ 或 nginx.conf），
# 若你的 nginx 把 sites-enabled 包含在 http 块内，这行可以留在本文件顶部。
log_format sub_noquery '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "-" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name sub.example.com;

    include /etc/nginx/snippets/cloudflare-only.conf;
    access_log /var/log/nginx/sub.example.com.access.log sub_noquery;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        try_files /__force_https__ @https_redirect;
    }

    location @https_redirect {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sub.example.com;

    include /etc/nginx/snippets/cloudflare-only.conf;
    access_log /var/log/nginx/sub.example.com.access.log sub_noquery;

    ssl_certificate     /etc/letsencrypt/live/sub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 订阅链接整条在查询串里，长度远超默认 8k。
    large_client_header_buffers 4 16k;
    # 请求只有查询串，没有正文。
    client_max_body_size 1m;

    # 引擎首次拉取一套远程规则可能要几秒；命中缓存后是毫秒级。
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # 不要在这里加 X-Robots-Tag：开放站是要被搜到的，应用自己按形态下发
    # robots 元信息（lan 拒绝收录、public 允许），响应头会盖过那套判断。
    add_header Referrer-Policy "no-referrer" always;

    # 引擎交接路由只服务于 Compose 内网，公网一律不可达。
    location ^~ /api/internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # 真实访客 IP 由 Cloudflare 放在 CF-Connecting-IP；$remote_addr 是 CF 节点。
        # 这里是覆盖而不是追加，应用按最右一段取客户端 IP 做限速。
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
